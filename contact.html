<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا - ArabAiHub</title>
<meta name="description" content="تواصل مع فريق ArabAiHub - أرسل استفسارك أو اقتراحك وهنرد عليك في أقرب وقت.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="articles/effects.css">
<style>
  :root{
    --bg:#10151f;
    --bg-elev:#171e2c;
    --bg-card:#1b2333;
    --border:#2a3346;
    --gold:#d3a34e;
    --gold-dim:#8a6f3a;
    --teal:#46b3a0;
    --coral:#d9634a;
    --text:#eeeae1;
    --text-dim:#93a0b5;
    --text-faint:#5c6579;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal', Arial, sans-serif;
    direction:rtl;
    line-height:1.8;
  }
  header{
    background:var(--bg-elev);
    border-bottom:1px solid var(--border);
    padding:16px 0;
  }
  .nav.wrap{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
  }
  .logo{font-weight:800; font-size:20px;}
  .logo span{color:var(--gold);}
  .nav-links{display:flex; gap:24px; list-style:none;}
  .nav-links a{color:var(--text-dim); text-decoration:none; font-weight:600; font-size:14px;}
  .nav-links a:hover{color:var(--gold);}
  main{max-width:620px; margin:0 auto; padding:60px 20px 80px;}
  h1{font-size:clamp(26px,4vw,38px); font-weight:800; margin-bottom:10px;}
  h1 span{color:var(--gold);}
  .lead{color:var(--text-dim); font-size:16px; margin-bottom:40px;}
  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:26px;
  }
  label{display:block; font-size:14px; font-weight:700; margin-bottom:6px; color:var(--text-dim);}
  input, textarea{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    margin-bottom:18px;
    resize:vertical;
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--gold);
  }
  button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--gold);
    color:#10151f;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    transition:transform .2s ease, opacity .2s ease;
  }
  button:hover{transform:translateY(-2px); opacity:.92;}
  .note{
    margin-top:18px;
    font-size:13px;
    color:var(--text-faint);
    text-align:center;
  }
  .alt-contact{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .alt-contact a{
    color:var(--teal);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
  }
  footer{
    background:var(--bg-elev);
    border-top:1px solid var(--border);
    padding:30px 20px;
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
  }
  footer .logo{justify-content:center; margin-bottom:14px;}
  footer nav{display:flex; justify-content:center; gap:20px; margin-bottom:14px; flex-wrap:wrap;}
  footer nav a{color:var(--text-dim); text-decoration:none; font-size:13px;}
  footer nav a:hover{color:var(--gold);}
</style>
</head>
<body>

<header>
  <div class="nav wrap">
    <div class="logo">Hub<span>AI</span>Arab</div>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#tools">الأدوات</a>
      <a href="index.html#article">المقالات</a>
      <a href="about.html">عن الموقع</a>
      <a href="contact.html">تواصل معنا</a>
    </nav>
  </div>
</header>

<main>
  <div class="fade-in">
    <h1>تواصل <span>معنا</span></h1>
    <p class="lead">عندك اقتراح، سؤال، أو أداة عايز نراجعها؟ ابعتلنا وهنرد عليك.</p>
  </div>

  <div class="card reveal">
    <form action="https://formspree.io/f/mkodpgya" method="POST">
      <label for="name">الاسم</label>
      <input type="text" id="name" name="name" required placeholder="اكتب اسمك">

      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" required placeholder="example@email.com">

      <label for="message">الرسالة</label>
      <textarea id="message" name="message" rows="5" required placeholder="اكتب رسالتك هنا..."></textarea>

      <button type="submit" class="btn-shine">إرسال الرسالة</button>
    </form>
    <p class="note">هنرد عليك خلال يومين إلى ثلاثة أيام عمل.</p>
  </div>

  <div class="alt-contact reveal">
    <a href="mailto:hello@arabaihub.com">hello@arabaihub.com</a>
  </div>
</main>

<footer>
  <div class="logo">Hub<span style="color:var(--gold);">AI</span>Arab</div>
  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="about.html">عن الموقع</a>
    <a href="contact.html">تواصل معنا</a>
  </nav>
  <p>© 2026 ArabAiHub. جميع الحقوق محفوظة.</p>
</footer>

<script src="articles/effects.js"></script>
</body>
</html>
